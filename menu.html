<!DOCTYPE html>
<html lang="ko"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>갤러리</title>
    <!-- 가독성과 귀여움을 동시에 잡는 웹폰트 (Jua & Pretendard) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;700&amp;display=swap" rel="stylesheet">
    <style>
        /* 기본 초기화 및 우주 배경 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* 게임 및 카드 클릭 시 텍스트 드래그 방지 */
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-deep: #090a1a;
            --bg-nebula: #1b143b;
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.18);
            --accent-pink: #ff6bcb;
            --accent-cyan: #4deeea;
            --accent-yellow: #ffe74c;
            --text-main: #ffffff;
            --text-sub: #c8c6e0;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: radial-gradient(ellipse at bottom, var(--bg-nebula) 0%, var(--bg-deep) 100%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            line-height: 1.6;
        }

        h1, h2, h3, .font-jua {
            font-family: 'Jua', sans-serif;
            letter-spacing: 0.5px;
        }

        /* 배경 별빛 캔버스 */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 효과(폭죽/이모지 비)를 위한 오버레이 캔버스 */
        #effect-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            pointer-events: none;
        }

        /* 메인 컨테이너 */
        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 16px 60px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* 공통 유리질감(Glassmorphism) 섹션 카드 */
        .section-box {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            transition: transform 0.3s ease;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--accent-yellow);
            text-shadow: 0 0 10px rgba(255, 231, 76, 0.4);
        }

        .section-desc {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        /* 헤더 / 프로필 영역 */
        header {
            text-align: center;
            padding: 32px 20px;
            position: relative;
            overflow: hidden;
        }

        .planet-avatar {
            width: 110px;
            height: 110px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6bcb 0%, #7366ff 50%, #4deeea 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            box-shadow: 0 0 30px rgba(255, 107, 203, 0.6), inset -10px -10px 20px rgba(0, 0, 0, 0.3);
            animation: float 4s ease-in-out infinite;
            position: relative;
        }

        /* 토성 고리 장식 */
        .planet-avatar::after {
            content: '';
            position: absolute;
            width: 150px;
            height: 36px;
            border: 4px solid rgba(255, 231, 76, 0.7);
            border-radius: 50%;
            transform: rotate(-18deg);
            box-shadow: 0 0 12px rgba(255, 231, 76, 0.5);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .badge {
            display: inline-block;
            background: rgba(77, 238, 234, 0.15);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 4px 14px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 2.3rem;
            background: linear-gradient(90deg, #fff, #ff6bcb, #4deeea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-sub);
            font-size: 1rem;
        }

        /* 1. 좋아하는 것 3가지 (3D 플립 카드) */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        @media (max-width: 640px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
        }

        .flip-card {
            background-color: transparent;
            height: 210px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .flip-card-front {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03));
        }

        .flip-card-front:hover {
            border-color: var(--accent-pink);
            box-shadow: 0 0 20px rgba(255, 107, 203, 0.3);
        }

        .card-emoji {
            font-size: 3.2rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .card-name {
            font-family: 'Jua', sans-serif;
            font-size: 1.4rem;
            color: #fff;
        }

        .tap-hint {
            margin-top: 8px;
            font-size: 0.78rem;
            color: var(--accent-cyan);
            background: rgba(0, 0, 0, 0.3);
            padding: 3px 10px;
            border-radius: 12px;
        }

        .flip-card-back {
            background: linear-gradient(135deg, #3a1c71 0%, #d76d77 100%);
            color: white;
            transform: rotateY(180deg);
            box-shadow: 0 8px 24px rgba(215, 109, 119, 0.4);
        }

        .flip-card-back h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: var(--accent-yellow);
        }

        .flip-card-back p {
            font-size: 0.92rem;
            line-height: 1.45;
            word-break: keep-all;
        }

        /* 2. OX 퀴즈 영역 */
        .quiz-question-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            margin-bottom: 18px;
            border: 1px dashed rgba(255, 255, 255, 0.25);
        }

        .quiz-q {
            font-family: 'Jua', sans-serif;
            font-size: 1.6rem;
            color: #fff;
        }

        .ox-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .ox-btn {
            flex: 1;
            max-width: 160px;
            height: 84px;
            border: none;
            border-radius: 20px;
            font-family: 'Jua', sans-serif;
            font-size: 2.5rem;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            color: white;
        }

        .ox-btn:active {
            transform: scale(0.93);
        }

        .btn-o {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.4);
        }

        .btn-x {
            background: linear-gradient(135deg, #ff5858, #f09819);
            box-shadow: 0 6px 20px rgba(255, 88, 88, 0.4);
        }

        .quiz-feedback {
            margin-top: 16px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            min-height: 32px;
            padding: 10px;
            border-radius: 12px;
            display: none;
            word-break: keep-all;
        }

        .quiz-feedback.show {
            display: block;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .quiz-feedback.correct {
            background: rgba(77, 238, 234, 0.2);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .quiz-feedback.wrong {
            background: rgba(255, 88, 88, 0.2);
            border: 1px solid #ff5858;
            color: #ff9e9e;
        }

        /* 틀렸을 때 흔들림 애니메이션 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px) rotate(-1deg); }
            40% { transform: translateX(10px) rotate(1deg); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }

        .shake-anim {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 3. 오늘의 우주 운세 뽑기 */
        .fortune-container {
            text-align: center;
        }

        .fortune-btn {
            background: linear-gradient(90deg, #ff6bcb, #845ec2, #4deeea);
            background-size: 200% auto;
            color: white;
            border: none;
            padding: 16px 32px;
            font-family: 'Jua', sans-serif;
            font-size: 1.3rem;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(255, 107, 203, 0.45);
            transition: all 0.3s ease;
        }

        .fortune-btn:hover {
            background-position: right center;
            transform: translateY(-2px);
        }

        .fortune-btn:active {
            transform: scale(0.95);
        }

        .fortune-result {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 231, 76, 0.4);
            border-radius: 18px;
            padding: 20px;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            word-break: keep-all;
        }

        .fortune-tag {
            font-size: 0.85rem;
            color: var(--accent-yellow);
            margin-bottom: 6px;
            font-weight: 700;
        }

        .fortune-text {
            font-size: 1.1rem;
            color: #fff;
        }

        /* 4. 10초 광클 미니게임 */
        .game-panel {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }

        .game-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 18px;
            background: rgba(255, 255, 255, 0.06);
            padding: 12px;
            border-radius: 14px;
        }

        .stat-box span {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .stat-box strong {
            font-family: 'Jua', sans-serif;
            font-size: 1.8rem;
            color: var(--accent-cyan);
        }

        #timer-display {
            color: var(--accent-yellow);
        }

        .click-target-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.4);
            background: radial-gradient(circle at 30% 30%, #ff8ae2, #7b2cbf);
            color: white;
            font-family: 'Jua', sans-serif;
            font-size: 1.35rem;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(123, 44, 191, 0.6);
            transition: transform 0.06s ease;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            touch-action: manipulation; /* 모바일 더블탭 줌 방지 */
        }

        .click-target-btn:active {
            transform: scale(0.9);
            box-shadow: 0 4px 15px rgba(255, 107, 203, 0.8);
        }

        .click-target-btn .rocket-icon {
            font-size: 2.5rem;
        }

        .game-result-msg {
            margin-top: 16px;
            font-size: 1.05rem;
            color: var(--accent-yellow);
            font-weight: 700;
            min-height: 28px;
            word-break: keep-all;
        }

        .reset-game-btn {
            margin-top: 12px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 20px;
            border-radius: 999px;
            font-size: 0.9rem;
            cursor: pointer;
            display: none;
        }

        .reset-game-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        footer {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-top: 10px;
            opacity: 0.8;
        }
    </style>
